spring:
  application:
    name: librarymanagement
  datasource:
    url: jdbc:mysql://localhost:3306/librarymanagement?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8081

management:
  endpoint:
    web:
      exposure:
        include: health,info

jwt:
  secretkey:
  expiration:
